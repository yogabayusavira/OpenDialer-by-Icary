[package]
name = "icary-open-dialer"
version = "0.1.0"
description = "Icary OpenDialer desktop app"
authors = ["Icary"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
bytes = "1"
tracing = "0.1"
